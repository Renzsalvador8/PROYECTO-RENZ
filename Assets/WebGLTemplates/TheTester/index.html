<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>{{{ PRODUCT_NAME }}}</title>
    <!-- The Tester — WebGL template. Fills its page/iframe; the game itself keeps a 16:9 composition. -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #091B2D; overflow: hidden; }
      #tt-stage { position: fixed; inset: 0; background: #091B2D; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #091B2D; outline: none; touch-action: none; }
      #tt-loader { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                   color: #ECE4D6; font-family: Georgia, 'Times New Roman', serif; transition: opacity .8s ease; pointer-events: none; }
      #tt-loader h1 { font-weight: 500; letter-spacing: .24em; font-size: clamp(28px, 5vw, 64px); margin: 0 0 .25em; }
      #tt-loader p { font-family: 'Helvetica Neue', Arial, sans-serif; letter-spacing: .42em; font-size: clamp(9px, 1.1vw, 13px);
                     color: #B67854; margin: 0 0 2.4em; text-transform: uppercase; }
      #tt-bar { width: min(320px, 60vw); height: 2px; background: rgba(236, 228, 214, .18); }
      #tt-fill { width: 0; height: 100%; background: #B67854; transition: width .2s ease; }
      #tt-banner { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); background: #1B3447; color: #ECE4D6;
                   padding: 8px 14px; font: 13px 'Helvetica Neue', Arial, sans-serif; display: none; border-radius: 2px; }
    </style>
  </head>
  <body>
    <div id="tt-stage">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="tt-loader">
        <h1>THE TESTER</h1>
        <p>The Ultimate Test · Zenith Studio</p>
        <div id="tt-bar"><div id="tt-fill"></div></div>
      </div>
      <div id="tt-banner"></div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      function showBanner(msg, type) {
        var b = document.querySelector("#tt-banner");
        b.style.display = "block";
        b.textContent = msg;
        if (type !== "error") setTimeout(function () { b.style.display = "none"; }, 5000);
      }
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showBanner,
      };
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      }
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#tt-fill").style.width = (100 * progress) + "%";
        }).then(function () {
          var l = document.querySelector("#tt-loader");
          l.style.opacity = 0;
          setTimeout(function () { l.remove(); }, 900);
        }).catch(function (message) {
          showBanner(message, "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
